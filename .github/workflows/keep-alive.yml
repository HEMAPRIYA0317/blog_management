name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes (Render free tier goes to sleep after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set yet."
            echo "Add your Render URL in GitHub Repo Settings -> Secrets and variables -> Actions"
            exit 0
          fi
          echo "Pinging $TARGET_URL/api/health/ ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$TARGET_URL/api/health/" || echo "000")
          echo "HTTP response status: $STATUS"
